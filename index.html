<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; img-src 'self' https://cdn-icons-png.flaticon.com blob: data:; frame-src 'self' blob: data:; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;">
  <!-- Prevent flash: hide body until language applied by renderer -->
  <style>body{visibility:hidden}</style>
  <script>
    // Early language detection: set fx_lang on first visit based on browser preferences.
    (function(){
      try {
        var key = 'fx_lang';
        if (localStorage.getItem(key)) return;
        var nav = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'fr'];
        var chosen = 'fr';
        for (var i=0;i<nav.length;i++){
          var l = (nav[i] || '').toLowerCase();
          if (!l) continue;
          if (l === 'fr' || l.indexOf('fr-') === 0) { chosen = 'fr'; break; }
          if (l === 'en' || l.indexOf('en-') === 0) { chosen = 'en'; break; }
        }
        localStorage.setItem(key, chosen);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <title>FusionX</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/337/337946.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1><img src="https://cdn-icons-png.flaticon.com/512/337/337946.png" alt="icon"><span class="brand">FusionX</span><span id="fileCount" class="file-count" style="display:none">0</span></h1>
      <p class="tagline" data-i18n="tagline">Combinez vos PDF et images en un clic</p>
    </header>
    <div class="options">
      <label><input type="checkbox" id="fitA4" data-i18n="fitA4"> A4 auto</label>
      <label><input type="checkbox" id="compressPdf" data-i18n="compressLabel"> Compresser</label>
      <select id="compressQuality" aria-label="Qualité de compression" style="display:none">
        <option value="0.85" data-i18n="qualityHigh">Haute qualité</option>
        <option value="0.65" selected data-i18n="qualityMedium">Qualité moyenne</option>
        <option value="0.40" data-i18n="qualityLow">Basse qualité</option>
      </select>
      <div class="right-controls">
        <button id="themeToggle" onclick="toggleTheme()" data-i18n="modeToggle">🌙 Mode sombre</button>
        <div class="lang-switch">
          <button id="langFr" class="lang-btn" aria-label="Français">FR</button>
          <button id="langEn" class="lang-btn" aria-label="English">EN</button>
        </div>
      </div>
    </div>
    <div class="controls">
  <input type="text" id="filename" data-i18n-placeholder="filenamePlaceholder" placeholder="Nom du fichier (ex: fusion.pdf)">
  <button class="btn" onclick="clearAll()" data-i18n="clearAllBtn">🗑️ Tout effacer</button>
    </div>
  <div class="upload" id="dropzone" tabindex="0" role="button" aria-label="Zone de dépôt de fichiers. Appuyez sur Entrée ou Espace pour ouvrir le sélecteur de fichiers">
      <div class="upload-icon">📁</div>
      <div class="upload-text" data-i18n="dropzoneText">Glisser-déposer ou cliquer pour sélectionner vos fichiers</div>
      <div class="upload-hint" data-i18n="dropzoneHint">PDF, JPG, PNG acceptés</div>
      <input type="file" id="upload" multiple accept=".pdf,image/*" style="display: none">
    </div>
    <!-- Empty state -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">📄</div>
      <p data-i18n="emptyStateText">Vos fichiers apparaîtront ici</p>
      <p class="empty-hint" data-i18n="emptyStateHint">Glissez pour réorganiser</p>
    </div>
    <div class="preview" id="previewList"></div>
    <div class="btn-group">
      <button class="btn" id="previewBtn" onclick="generatePDF(true)" data-i18n="previewBtn">🔎 Visualiser</button>
      <button class="btn" id="generateBtn" onclick="generatePDF(false)" data-i18n="generateBtn">📄 Générer le PDF</button>
    </div>
  <div id="statusArea" aria-live="polite" style="margin-top:10px"></div>
  <iframe id="previewFrame" style="display:none;"></iframe>
  <div id="spinner" class="spinner" aria-hidden="true" style="display:none">Génération en cours…</div>
  <!-- toast container for in-app notifications -->
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>
  <div class="footer" data-i18n="footerText">Développé avec ❤️ par Jeff Longele — vos fichiers ne sont jamais enregistrés.</div>
  </div>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
